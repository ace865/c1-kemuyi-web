name: Bug 报告
description: 报告可以稳定复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交令牌、个人数据或安全漏洞细节。
  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: 例如 v1.1.0 或提交 SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - Windows 安装版
        - Windows 源码运行
        - 桌面浏览器
        - Android
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开…… 2. 点击…… 3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: 请先移除个人信息和令牌。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这不是题库内容勘误。
          required: true
        - label: 我确认公开内容中不包含敏感信息。
          required: true
