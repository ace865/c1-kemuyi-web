name: 功能建议
description: 提议一个明确、可验证的新功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户场景，不要只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: impact
    attributes:
      label: 可能影响
      options:
        - label: 动画或视觉设计
        - label: 题库或图片
        - label: 本地用户数据
        - label: Electron 或安装包
        - label: Android
